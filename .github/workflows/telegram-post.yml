name: Telegram Top Proxies Post

on:
  schedule:
    # Every 2 hours at minute 17 (UTC). GitHub may delay scheduled runs a few minutes.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print only, do not send)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: Files/requirements.txt

      - name: Install dependencies
        working-directory: ./Files
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send top proxies to Telegram channel
        working-directory: ./Files
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOP_N: '4'
          EXCLUDE_HOURS: '6'
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python send_top_proxies.py

      - name: Commit sent-history
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Files/last_sent.json
          if git diff --staged --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "Update sent proxy history"
            git pull --rebase
            git push
          fi
